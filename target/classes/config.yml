language: "en"
farmer-cost: 8000.0
farmer-tax: 25.0

# Vacuum/Hopper mode settings
vacuum:
  max-radius: 10
  upgrade-cost-per-level: 5000
  levels:
    1: 3
    2: 5
    3: 7
    4: 10

# Discord webhook notifications
discord:
  enabled: true
  webhook-url: ""
  notify-sell: true
  notify-upgrade: true
  notify-booster: true
  notify-zerotax: true
  embed-color: 15773457

# External credit database
database:
  host: ""
  port: ""
  database: ""
  username: ""
  password: ""
  table: "Accounts"
  columns:
    player: "username"
    credit: "credit"

# Farmer leveling system
# Set enabled to false to disable the entire leveling system
# XP = total items ever collected
# unlock = feature unlocked at this level (optional)
# rewards = list of rewards given when reaching this level
#   - type: item / command
#   - item rewards: material, amount, name (optional), lore (optional)
#   - command rewards: command (use %player% for player name)
farmer-levels:
  enabled: true
  1:
    xp: 0
    name: "Rookie"
  2:
    xp: 1000
    name: "Apprentice"
    rewards:
      - type: "item"
        material: "DIAMOND"
        amount: 5
        name: "&#E6CF00Level 2 Reward"
      - type: "command"
        command: "say %player% reached Apprentice level!"
  3:
    xp: 5000
    name: "Farmer"
    unlock: "auto-harvest"
    rewards:
      - type: "item"
        material: "EMERALD"
        amount: 10
        name: "&#03FF00Farmer Bonus"
      - type: "item"
        material: "GOLDEN_APPLE"
        amount: 3
  4:
    xp: 15000
    name: "Expert"
    unlock: "vacuum"
    rewards:
      - type: "item"
        material: "DIAMOND_BLOCK"
        amount: 3
      - type: "command"
        command: "crate give %player% farmer_key 1"
  5:
    xp: 50000
    name: "Master"
    unlock: "spawner-kill"
    rewards:
      - type: "command"
        command: "crate give %player% legendary_key 1"
      - type: "item"
        material: "NETHERITE_INGOT"
        amount: 2
        name: "&#FF6600Master Reward"
  6:
    xp: 100000
    name: "Legendary"
    rewards:
      - type: "command"
        command: "crate give %player% legendary_key 3"
      - type: "item"
        material: "NETHER_STAR"
        amount: 1
        name: "&#FFD700&l★ Legendary Star ★"
        lore:
          - "&7A rare reward for"
          - "&7reaching Legendary status!"
